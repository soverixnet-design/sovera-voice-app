name: sovera
description: Sovera premium voice party app — offline design preview.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/sovera-logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/sovera-logo.png
  remove_alpha_ios: true
