name: sovera
description: Sovera premium voice party app — voice community app with account and room storage.
publish_to: none
version: 0.18.3+33
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  firebase_core: 5.0.0
  firebase_auth: 7.0.0
  google_sign_in: 7.2.0
  supabase_flutter: 2.18.3
  permission_handler: 13.0.2
  shared_preferences: 2.5.6
  image_picker: 1.2.4
  audioplayers: 6.8.1
  livekit_client: 2.13.1
  webview_flutter: ^4.13.0
  http: 1.6.0
  url_launcher: 6.3.3
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/sovera-logo-transparent.png
    - assets/games/food-wheel.html
    - assets/sounds/
    - assets/effects/
    - assets/medals/
    - assets/room-frames/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/sovera-logo-transparent.png
  remove_alpha_ios: true
  background_color_ios: '#37166E'
  adaptive_icon_background: '#37166E'
  adaptive_icon_foreground: assets/sovera-logo-transparent.png


