name: Admin control integration checks
on:
  push:
    branches: [admin-control-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice_server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi==0.146.0 httpx==0.28.1 PyJWT==2.15.1 livekit-api==1.2.2
      - run: python server/voice/test_seats.py
      - run: python server/voice/test_firebase_auth.py
      - run: python -m unittest server.food.test_food server.food.test_identity -v
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: admin/tests
      - run: npm test
        working-directory: admin/tests
      - run: node --check admin/web/app.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --org com.sovera --project-name sovera .
      - run: python3 scripts/configure_mobile_auth.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: admin-integration-preview-apk-not-production
          path: build/app/outputs/flutter-apk/app-debug.apk
