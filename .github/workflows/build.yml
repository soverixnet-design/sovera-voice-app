name: Sovera mobile builds
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform projects
        run: flutter create --platforms=android,ios --org com.sovera --project-name sovera .
      - run: python3 scripts/configure_mobile_auth.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-dependencies-${{ runner.os }}
          path: pubspec.lock
      - run: dart format --output=none --set-exit-if-changed lib test || dart format lib test
      - run: flutter analyze
      - run: flutter test
      - uses: actions/upload-artifact@v4
        with:
          name: design-review
          path: build/design-review
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: sovera-android-preview-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --org com.sovera --project-name sovera .
      - run: python3 scripts/configure_mobile_auth.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-dependencies-${{ runner.os }}
          path: pubspec.lock
      - run: flutter build ios --simulator --debug
      - uses: actions/upload-artifact@v4
        with:
          name: sovera-ios-simulator-preview
          path: build/ios/iphonesimulator/Runner.app

