name: Firebase Google and email sign-in check
on:
  workflow_dispatch:
  push:
    branches: [admin-control-preview]
    paths:
      - lib/firebase_login_main.dart
      - test/firebase_login_test.dart
      - lib/firebase_profile.dart
      - lib/firebase_voice.dart
      - server/accounts/**
      - server/voice/**
      - lib/firebase_rooms.dart
      - test/firebase_rooms_test.dart
      - test/firebase_profile_test.dart
      - .github/workflows/firebase-login-check.yml
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --org com.sovera --project-name sovera .
      - run: python3 scripts/configure_mobile_auth.py
      - name: Set Android Firebase minimum SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          p.write_text(p.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 24'))
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart format lib/firebase_login_main.dart test/firebase_login_test.dart
      - run: flutter analyze
      - run: flutter test test/firebase_login_test.dart test/firebase_profile_test.dart test/firebase_rooms_test.dart
      - run: flutter build apk --debug --target lib/firebase_login_main.dart
      - name: Record this APK's public signing fingerprints
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          tools = sorted((Path(os.environ['ANDROID_HOME']) / 'build-tools').glob('*/apksigner'))
          result = subprocess.run([str(tools[-1]), 'verify', '--print-certs',
              'build/app/outputs/flutter-apk/app-debug.apk'], check=True, text=True, capture_output=True)
          public = '\n'.join(line for line in result.stdout.splitlines() if 'certificate SHA-' in line)
          print(public)
          Path('build/firebase-signing-fingerprints.txt').write_text(public + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sovera-firebase-login-check-not-full-app
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/firebase-signing-fingerprints.txt
            pubspec.lock
