name: Publish Sovera APK download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-apk.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified APK
        run: gh run download 39060400382 --name sovera-android-preview-apk --dir apk
      - name: Check and name APK
        run: |
          test -s apk/app-debug.apk
          unzip -tq apk/app-debug.apk
          mv apk/app-debug.apk apk/Sovera-v0.13.0.apk
          cp apk/Sovera-v0.13.0.apk apk/Sovera.apk
          sha256sum apk/Sovera-v0.13.0.apk apk/Sovera.apk
      - name: Publish public download
        run: |
          gh release create v0.13.0 apk/Sovera-v0.13.0.apk apk/Sovera.apk --target 8f8f3925033968ce79e793384577052c627707ff --title "Sovera 0.13.0 - Invite and referrals" --notes "Adds a persistent Invite and referrals center: personal codes, copy/share invitations, one-time friend code claims, referral counts and recent joins. Recipients must sign in and enter the code manually. Coin rewards and automatic install attribution are not enabled. Google/Facebook provider setup, live voice and payments remain pending."
