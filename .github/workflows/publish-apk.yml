name: Publish Sovera APK download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-apk.yml'
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified APK
        run: gh run download 39034976923 --name sovera-android-preview-apk --dir apk
      - name: Check and name APK
        run: |
          test -s apk/app-debug.apk
          unzip -tq apk/app-debug.apk
          mv apk/app-debug.apk apk/Sovera-v0.12.5.apk
          sha256sum apk/Sovera-v0.12.5.apk
      - name: Publish public download
        run: |
          gh release create v0.12.5 apk/Sovera-v0.12.5.apk --target 96cbcdd245c2f0bb5091cc1f4163f72d2dbf976f --title "Sovera 0.12.5 - Android preview" --notes "Android preview with circular four-column seats and room-blended entry animations. Live voice, payments, and Google/Facebook provider setup are still pending."
