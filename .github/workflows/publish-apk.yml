name: Publish Sovera APK download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-apk.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified APK
        run: gh run download 39069621078 --name sovera-android-preview-apk --dir apk
      - name: Check and name APK
        run: |
          test -s apk/app-debug.apk
          unzip -tq apk/app-debug.apk
          mv apk/app-debug.apk apk/Sovera-v0.13.1.apk
          cp apk/Sovera-v0.13.1.apk apk/Sovera.apk
          sha256sum apk/Sovera-v0.13.1.apk apk/Sovera.apk
      - name: Publish public download
        run: |
          gh release create v0.13.1 apk/Sovera-v0.13.1.apk apk/Sovera.apk --target "$GITHUB_SHA" --title "Sovera 0.13.1 - Facebook login screen" --notes "Adds Continue with Facebook beside Google on the Sovera sign-in screen, plus a visible sign-in entry in guest mode. Successful account sign-in dismisses guest preview routes. Facebook is configured on Supabase; Meta publishing, business verification and review remain pending for general availability. Google provider setup, live voice and payments remain pending."
