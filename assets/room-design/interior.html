<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Room Interior</title>
<style>
:root{--bg1:#171040;--bg2:#0a0820;--a:#8b5cf6;--b:#ec4899;--k1:#7c3aed;--k2:#db2777;--k3:#0ea5e9;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--mu:#b0a7d6;--gold:#fbbf24;--red:#fb7185;--grn:#34d399;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#05030f;color:#fff;font-family:system-ui,"Noto Sans Bengali","Hind Siliguri",sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit}
.app{width:100%;max-width:none;height:100dvh;position:relative;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2) 70%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;pointer-events:none;animation:dr 14s ease-in-out infinite alternate}
.b1{width:260px;height:260px;background:var(--k1);top:-60px;left:-70px}
.b2{width:240px;height:240px;background:var(--k2);top:220px;right:-90px;animation-delay:-5s;opacity:.32}
.b3{width:220px;height:220px;background:var(--k3);bottom:90px;left:-80px;animation-delay:-9s;opacity:.25}
.hasbg .blob{opacity:.12}
@keyframes dr{to{transform:translate(30px,40px) scale(1.15)}}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;position:relative;z-index:3}
.ib{width:38px;height:38px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);display:grid;place-items:center;cursor:pointer;flex:none;font-size:17px}
.ib svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.room{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:18px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);cursor:pointer;text-align:left}
.rav{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--a),var(--b)) center/cover;display:grid;place-items:center;font-size:20px;flex:none}
.rt{min-width:0;flex:1}.rt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{color:var(--mu);font-size:11px;display:flex;align-items:center;gap:4px}
.live{width:6px;height:6px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn)}
.stats{display:flex;gap:6px;padding:2px 14px 4px;font-size:11px;color:var(--mu);position:relative;z-index:3;overflow-x:auto;scrollbar-width:none}
.pill{flex:none;white-space:nowrap;padding:4px 10px;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px)}
.pill i{font-style:normal;color:#fff;font-weight:600}
.stage{flex:1;overflow-y:auto;padding:30px 20px 20px;position:relative;z-index:2;scrollbar-width:none;min-height:0}
.stage::-webkit-scrollbar{display:none}
.host{display:flex;justify-content:center;margin:4px 0 14px}
.grid{display:grid;gap:14px 4px}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:0;min-width:0}
.av{position:relative;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:29px}
.dense .av{width:50px;height:50px;font-size:24px}
.host .av{width:92px;height:92px;font-size:46px}
.host .av::before{content:"";position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--b) 55%,transparent),transparent 70%);animation:pl 3s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.15);opacity:.6}}
.ring{position:absolute;inset:-3.5px;border-radius:50%;padding:2.5px;background:conic-gradient(var(--a),var(--b),var(--gold),var(--a));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
[data-frame=gold] .ring{background:conic-gradient(#fde68a,#f59e0b,#fef3c7,#b45309,#fde68a);filter:drop-shadow(0 0 5px rgba(251,191,36,.7))}
[data-frame=neon] .ring{background:conic-gradient(#22d3ee,#a78bfa,#22d3ee);filter:drop-shadow(0 0 6px #22d3ee)}
[data-frame=none] .ring{display:none}
[data-frame=sq] .av,[data-frame=sq] .face,[data-frame=sq] .ring,[data-frame=sq] .wave{border-radius:26%}
.face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 -8px 16px rgba(0,0,0,.3),0 8px 18px rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.22)}
.face::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.38),transparent 55%)}
.empty .face{background:var(--glass)!important;border:1.5px dashed rgba(255,255,255,.3);font-size:20px;color:var(--mu);box-shadow:none}
.empty .face::after,.lock .face::after{display:none}
.empty .ring,.lock .ring{display:none}
.lock .face{background:rgba(0,0,0,.42)!important;box-shadow:none;font-size:20px}
.wave{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--grn);opacity:0;pointer-events:none}
.talk .wave{animation:w 1.4s ease-out infinite}.talk .wave.b{animation-delay:.7s}
@keyframes w{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.55);opacity:0}}
.got .face{animation:gt .5s ease 2}
@keyframes gt{50%{transform:scale(1.14);box-shadow:0 0 28px 6px rgba(251,191,36,.8)}}
.badge{position:absolute;right:-3px;bottom:-3px;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--red);border:2px solid var(--bg2);z-index:2}
.crown{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:23px;z-index:2;filter:drop-shadow(0 2px 6px rgba(251,191,36,.7))}
.nm{font-size:11px;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 9px;border-radius:10px;background:rgba(0,0,0,.32)}
.host .nm{font-size:13px;max-width:170px;font-weight:600;padding:3px 12px}
.tag{font-size:10px;color:var(--gold)}
.chatw{position:relative;margin:0 12px;z-index:2}.chat{height:clamp(150px,27vh,240px);overflow-y:auto;position:relative;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 8%);mask-image:linear-gradient(transparent,#000 8%);display:flex;flex-direction:column;gap:5px;padding:8px 0 2px}
.newb{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:none;padding:5px 14px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--a),var(--b));font-size:12px;font-weight:600;cursor:pointer;z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.mimg{display:block;max-width:190px;max-height:170px;border-radius:10px;margin-top:5px;cursor:zoom-in}
.imgb{display:grid;place-items:center;position:relative}.imgb i{position:absolute;right:0;bottom:1px;font-size:11px;font-style:normal;display:none}.imgb.locked{opacity:.75}.imgb.locked i{display:block}
.pbar{height:10px;border-radius:5px;background:var(--glass);overflow:hidden;margin:10px 0 6px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}
.mini{display:flex;align-items:center;gap:8px}.mini button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--glass);cursor:pointer;font-size:16px}
.viewer{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}.viewer.on{display:flex}
.etabs{display:flex;gap:8px;margin-bottom:10px}.etabs button{flex:1;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:13px;cursor:pointer}.etabs button.sel{border-color:var(--gold);background:rgba(251,191,36,.12)}
.gifts.em .gf{padding:12px 2px}.gifts.em .gf span{font-size:34px}.viewer img{max-width:94%;max-height:88%;border-radius:12px}
.chat::-webkit-scrollbar{display:none}
.msg{display:flex;align-items:flex-start;gap:7px;max-width:92%;align-self:flex-start;animation:in .25s ease}
.mav{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:none;border:1px solid rgba(255,255,255,.25)}
.mb{padding:5px 11px 6px;border-radius:4px 15px 15px 15px;background:rgba(0,0,0,.38);border:1px solid var(--line);backdrop-filter:blur(8px);min-width:0}
.mn{font-size:11.5px;font-weight:700;color:#c4b5fd;display:inline-flex;align-items:center;gap:5px;margin-right:6px}
.lv{font-size:9px;padding:0 5px;border-radius:7px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:700}
.mt{font-size:13.5px;line-height:1.4;word-break:break-word}
.msg.me .mn{color:var(--gold)}
.msg.me .mb{background:linear-gradient(135deg,color-mix(in srgb,var(--a) 45%,#000),color-mix(in srgb,var(--b) 35%,#000));border-color:rgba(255,255,255,.2)}
.sys{align-self:center;font-size:11.5px;color:var(--mu);padding:3px 12px;border-radius:12px;background:rgba(0,0,0,.3);text-align:center}
.gfm .mb{background:linear-gradient(135deg,rgba(251,191,36,.28),rgba(236,72,153,.2));border-color:rgba(251,191,36,.4)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.dock{position:relative;z-index:4;padding:6px 10px 12px;background:linear-gradient(transparent,rgba(5,3,15,.9) 35%)}
.tray{display:none;gap:4px;overflow-x:auto;padding:8px;margin:0 2px 8px;border-radius:18px;background:rgba(25,16,60,.92);border:1px solid var(--line);backdrop-filter:blur(16px);scrollbar-width:none}
.tray.on{display:flex}
.tray button{flex:none;font-size:26px;width:42px;height:42px;border-radius:12px;border:0;background:none;cursor:pointer}
.tray button:active{background:var(--glass)}
.irow{display:flex;align-items:center;gap:6px}
.inp{flex:1;min-width:0;display:flex;align-items:center;height:46px;border-radius:24px;border:1px solid var(--line);background:rgba(255,255,255,.1);backdrop-filter:blur(14px);padding:0 4px}
.inp:focus-within{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 30%,transparent)}
.inp button{border:0;background:none;width:36px;height:36px;border-radius:50%;font-size:21px;cursor:pointer;flex:none}
.inp input{flex:1;min-width:0;border:0;outline:0;background:none;color:#fff;font:inherit;font-size:16px;padding:0 4px}
.inp input::placeholder{color:var(--mu)}
.inp .snd{background:linear-gradient(135deg,var(--a),var(--b));font-size:15px;color:#fff;display:grid;place-items:center}
.rb{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);font-size:19px;cursor:pointer;position:relative;flex:none;display:grid;place-items:center}
.rb em{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--red);font-style:normal;font-size:10px;display:grid;place-items:center;padding:0 4px}
.mic{width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;font-size:22px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 20px color-mix(in srgb,var(--a) 55%,transparent),inset 0 2px 0 rgba(255,255,255,.35);transition:.2s}
.mic.off{background:linear-gradient(135deg,#f43f5e,#be123c);box-shadow:0 6px 20px rgba(244,63,94,.45)}
.sheet-bg{position:absolute;inset:0;background:rgba(3,2,12,.62);z-index:10;display:none;align-items:flex-end;backdrop-filter:blur(3px)}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-height:84%;overflow:auto;border-radius:28px 28px 0 0;background:linear-gradient(color-mix(in srgb,var(--bg1) 80%,#fff 8%),var(--bg2));border-top:1px solid var(--line);padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.back{border:0;background:var(--glass);width:30px;height:30px;border-radius:50%;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.row small{display:block;color:var(--mu);font-size:11.5px}
.sw{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;border:0;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--grn)}.sw.on::after{left:23px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.act{padding:14px 6px;border-radius:18px;border:1px solid var(--line);background:var(--glass);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.act span{font-size:24px}.act.dg{color:#fda4af;border-color:rgba(251,113,133,.4)}
.who{display:flex;align-items:center;gap:12px;margin-bottom:12px}.who .av{width:50px;height:50px;font-size:25px}
.lbl{font-size:11.5px;color:var(--mu);margin:4px 0 8px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;background:none;border:0;cursor:pointer;color:var(--mu);width:52px}
.chip .c{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;border:2px solid transparent}
.chip.sel{color:#fff}.chip.sel .c{border-color:var(--gold);box-shadow:0 0 12px rgba(251,191,36,.6)}
.gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gf{padding:10px 2px;border-radius:16px;border:1px solid var(--line);background:var(--glass);text-align:center;font-size:11px;color:var(--gold);cursor:pointer}
.gf span{display:block;font-size:30px;margin-bottom:2px}
.gf.sel{border-color:var(--gold);background:rgba(251,191,36,.12)}
.gbar{display:flex;align-items:center;gap:8px;margin-top:14px}
.qty{display:flex;border-radius:20px;border:1px solid var(--line);overflow:hidden}
.qty button{border:0;background:none;padding:9px 12px;font-size:12px;cursor:pointer;color:var(--mu)}
.qty button.sel{background:var(--glass);color:#fff}
.send{flex:1;padding:12px;border-radius:24px;border:0;font-weight:700;background:linear-gradient(135deg,var(--a),var(--b));cursor:pointer}
.field{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-size:16px;margin:2px 0 8px}
.pic{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.pic .big{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,var(--a),var(--b)) center/cover;display:grid;place-items:center;font-size:34px;position:relative;cursor:pointer;flex:none;border:1px solid var(--line)}
.pic .big i{position:absolute;right:-6px;bottom:-6px;width:26px;height:26px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:13px;font-style:normal}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.th{border-radius:16px;border:2px solid transparent;padding:0;height:84px;cursor:pointer;position:relative;overflow:hidden;font-size:11.5px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font-weight:600;text-shadow:0 1px 4px #000}
.th.sel{border-color:#fff}.th.sel::after{content:"✓";position:absolute;top:6px;right:8px;font-size:13px}
.step{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 4px}
.step button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);font-size:22px;cursor:pointer}
.step b{font-size:30px;min-width:50px;text-align:center}
.fr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fr button{border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:10px 2px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.fr button.sel{border-color:var(--gold)}
.fr .pv{width:30px;height:30px;border-radius:50%;background:#4c3a9a;border:2.5px solid var(--a)}
.fx{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.fx .g{position:absolute;left:0;top:0;font-size:40px;line-height:1;filter:drop-shadow(0 4px 10px rgba(251,191,36,.7));will-change:transform}
.fx .s{position:absolute;left:0;top:0;font-size:14px}
.fx .t{position:absolute;left:0;top:0;font-size:13px;font-weight:800;color:var(--gold);white-space:nowrap;text-shadow:0 2px 6px #000}
.toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(20,12,50,.94);padding:8px 16px;border-radius:20px;font-size:12.5px;z-index:30;display:none;border:1px solid var(--line);white-space:nowrap}

html,body{width:100%;height:100%;overflow:hidden;padding:0!important}
body{display:block}
.app{width:100%;max-width:none;min-height:0;margin:0;height:100dvh}
.top{padding-top:12px}.rt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat{overflow:visible}.av{overflow:visible}.grid{row-gap:30px}.equipped-frame{position:absolute;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:2}
.gift-flight{position:absolute;left:0;top:0;width:84px;height:84px;object-fit:contain;pointer-events:none}
.gf small{display:block}.sheet .act,.sheet .send{touch-action:manipulation}
@media(max-width:360px){.top{gap:5px;padding-left:8px;padding-right:8px}.ib{width:34px;height:34px}.room{gap:6px;padding-right:7px}.dock{padding-left:7px;padding-right:7px}.irow{gap:5px}.rb{width:36px;height:36px}.mic{width:42px;height:42px}.av{width:52px;height:52px}.host .av{width:78px;height:78px}}
@media(max-height:650px){.host{margin-bottom:8px}.host .av{width:68px;height:68px}.av{width:46px;height:46px}.grid{gap:10px 4px}.chat{height:clamp(90px,22vh,140px)}.stage{padding-top:5px}}
@media(prefers-reduced-motion:reduce){.blob,.host .av::before{animation:none}}
</style>
</head>
<body>
<div class="app" id="app" data-frame="grad">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
  <div class="top">
    <button class="ib" id="exit" aria-label="Exit"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    <button class="ib" id="min" aria-label="Minimize"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="room" id="roomBtn"><div class="rav" id="rav">🎙️</div><div class="rt"><b id="rname"></b><small><i class="live"></i>লাইভ</small></div><span>⚙️</span></button>
    <button class="ib" id="bOwn" aria-label="Owner">👑</button>
  </div>
  <div class="stats"><span class="pill">👥 <i id="livePeople">—</i></span><span class="pill">🏆 <i id="liveWins">—</i></span><span class="pill" id="mstat"></span><span class="pill" id="cstat"></span><span class="pill" id="lstat"></span></div>
  <div class="stage"><div class="host" id="host"></div><div class="grid" id="grid"></div></div>
  <div class="chatw"><div class="chat" id="chat"></div><button class="newb" id="newb">↓ নতুন মেসেজ</button></div>
  <div class="dock">
    <div class="tray" id="tray"></div>
    <div class="irow">
      <div class="inp"><button id="emo" aria-label="Emoji">😊</button><input id="txt" placeholder="মেসেজ লিখুন…" enterkeyhint="send" autocomplete="off"><button class="snd" id="sendTxt" aria-label="Send" style="display:none">➤</button><button id="imgBtn" class="imgb" aria-label="Photo">🖼️<i>🔒</i></button></div>
      <button class="rb" id="bMsg" aria-label="Messages">💬</button>
      <button class="rb" id="bGift" aria-label="Gifts">🎁</button>
      <button class="rb" id="bGame" aria-label="Games">🎮</button>
      <button class="mic" id="mic" aria-label="Mute or unmute">🎤</button>
    </div>
  </div>
  <div class="viewer" id="viewer"><img id="vimg" alt=""></div>
  <div class="fx" id="fx"></div>
  <div class="toast" id="toast"></div>
  <div class="sheet-bg" id="bg"><div class="sheet" id="sheet"></div></div>
</div>
<script src="room-live.js"></script>
</body></html>
